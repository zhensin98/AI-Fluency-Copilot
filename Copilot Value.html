<script>
(function() {
  var company = null;
  try { company = JSON.parse(sessionStorage.getItem('active_company') || 'null'); } catch(e) {}
  if (!company || !company.colors) return;
  var c = company.colors;
  var root = document.documentElement;
  function rgb(hex) {
    if (!hex || hex.length < 7) return '0,0,0';
    return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);
  }
  if (c.primary) {
    var pr = rgb(c.primary);
    root.style.setProperty('--brand-primary',      c.primary);
    root.style.setProperty('--color-primary',      c.primary);
    root.style.setProperty('--primary-color',      c.primary);
    root.style.setProperty('--gradient-start',     c.primary);
    root.style.setProperty('--color-info',         c.primary);
    root.style.setProperty('--color-primary-light','rgba('+pr+',0.08)');
    root.style.setProperty('--color-primary-muted','rgba('+pr+',0.06)');
    root.style.setProperty('--color-primary-focus','rgba('+pr+',0.20)');
    root.style.setProperty('--color-primary-pale', 'rgba('+pr+',0.08)');
    root.style.setProperty('--color-nav-hover',    'rgba('+pr+',0.12)');
    root.style.setProperty('--color-bg-highlight', 'rgba('+pr+',0.06)');
    root.style.setProperty('--info-box-bg',        'rgba('+pr+',0.08)');
    root.style.setProperty('--color-info-bg',      'rgba('+pr+',0.08)');
    root.style.setProperty('--color-subsection-bg','rgba('+pr+',0.05)');
  }
  if (c.primaryDark) {
    root.style.setProperty('--brand-primary-dark', c.primaryDark);
    root.style.setProperty('--brand-secondary',    c.primaryDark);
    root.style.setProperty('--color-primary-dark', c.primaryDark);
    root.style.setProperty('--secondary-color',    c.primaryDark);
    root.style.setProperty('--gradient-end',       c.primaryDark);
  }
  if (c.primaryLight) {
    root.style.setProperty('--brand-primary-light',c.primaryLight);
  }
  if (c.accent) {
    var ar = rgb(c.accent);
    root.style.setProperty('--brand-accent',       c.accent);
    root.style.setProperty('--color-accent',       c.accent);
    root.style.setProperty('--accent-color',       c.accent);
    root.style.setProperty('--color-accent-light', 'rgba('+ar+',0.10)');
    root.style.setProperty('--color-accent-muted', 'rgba('+ar+',0.05)');
    root.style.setProperty('--color-accent-border','rgba('+ar+',0.30)');
  }
  if (c.sidebarBg) {
    root.style.setProperty('--brand-sidebar-bg',   c.sidebarBg);
    root.style.setProperty('--color-sidebar-bg',   c.sidebarBg);
  }
})();
</script>

let currentView = 'dashboard';
let copilotType = 'chat';
let searchTerm = '';
let filters = {role:'all',habit:'all',priority:'all',entry:'all'};
let searchTimeout = null;

function navigateTo(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach((item, i) => {
    const views = ['dashboard','habits','roles','entrypoints','usecases'];
    item.classList.toggle('active', views[i] === view);
  });
  render();
}

function setCopilotType(type) {
  copilotType = type;
  filters = {role:'all',habit:'all',priority:'all',entry:'all'};
  searchTerm = '';
  render();
}

function setFilter(key, value) {
  filters[key] = value;
  updateUseCaseCards();
}

function setSearch(value) {
  searchTerm = value;
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => updateUseCaseCards(), 150);
}

function updateUseCaseCards() {
  const container = document.getElementById('uc-results-area');
  if (container) container.innerHTML = renderUseCaseCardsContent();
}

function getHabit(habitId) {
  const source = habitId.startsWith('M') ? DATA.m365.habits : DATA.chat.habits;
  return source.find(h => h.id === habitId) || {id: habitId, name: habitId, color: '#666'};
}

function getCurrentHabits() { return copilotType === 'm365' ? DATA.m365.habits : DATA.chat.habits; }
function getCurrentByRole() { return copilotType === 'm365' ? DATA.m365.byRole : DATA.chat.byRole; }
function getCurrentByHabit() { return copilotType === 'm365' ? DATA.m365.byHabit : DATA.chat.byHabit; }
function getCurrentMatrix() { return copilotType === 'm365' ? DATA.m365.roleHabitMatrix : DATA.chat.roleHabitMatrix; }
function getCurrentEntryPoints() { return copilotType === 'm365' ? DATA.m365.entryPoints : DATA.chat.entryPoints; }
function getCurrentUseCases() { 
  const ucs = copilotType === 'm365' ? DATA.useCases.m365 : DATA.useCases.chat;
  return [...ucs].sort((a, b) => {
    const aNum = parseInt(a.habitId.replace(/[^0-9]/g, ''));
    const bNum = parseInt(b.habitId.replace(/[^0-9]/g, ''));
    return aNum - bNum;
  });
}

function getFilteredUseCases() {
  let uc = getCurrentUseCases();
  if (filters.role !== 'all') uc = uc.filter(u => u.code === filters.role);
  if (filters.habit !== 'all') uc = uc.filter(u => u.habitId === filters.habit);
  if (filters.priority !== 'all') uc = uc.filter(u => u.priority.toLowerCase() === filters.priority);
  if (filters.entry !== 'all') uc = uc.filter(u => u.entry === filters.entry);
  if (searchTerm && searchTerm.length >= 2) {
    const term = searchTerm.toLowerCase();
    uc = uc.filter(u => u.name.toLowerCase().includes(term) || u.pain.toLowerCase().includes(term) || u.prompt.toLowerCase().includes(term) || u.role.toLowerCase().includes(term));
  }
  return uc;
}

function highlightText(text, term) {
  if (!term || term.length < 2) return text;
  try {
    const regex = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<span class="search-highlight">$1</span>');
  } catch(e) { return text; }
}

function copyPrompt(btn, event) {
  event.stopPropagation();
  const promptText = btn.closest('.prompt-box').querySelector('.prompt-text').textContent;
  navigator.clipboard.writeText(promptText).then(() => {
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Copied!';
    setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy'; }, 2000);
  });
}

  const entryPoints = getCurrentEntryPoints();
  const isM365 = copilotType === 'm365';
  
  let entryCards = entryPoints.map(e => '<div class="entry-card ' + (isM365 ? 'm365' : 'chat') + '" onclick="filters.entry=\'' + e.name + '\';navigateTo(\'usecases\')"><div class="entry-header"><div class="entry-icon ' + (isM365 ? 'm365' : 'chat') + '"><svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg></div><div><div class="entry-name">' + e.name + '</div><div class="entry-desc">' + e.desc + '</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><div class="entry-count ' + (isM365 ? 'm365' : 'chat') + '">' + e.count + '</div><span class="usecase-tag ' + (isM365 ? 'copilot-m365' : 'copilot-chat') + '">' + e.count + ' use cases</span></div></div>').join('');
  
  return '<div class="section-header"><div class="section-title-group"><div class="section-title">Explore by Entry Point</div><div class="section-subtitle">Find prompts based on where you work</div></div>' + renderCopilotToggle() + '</div><div class="cards-grid cards-grid-3">' + entryCards + '</div>';
}

function renderUseCases() {
  const byHabit = getCurrentByHabit();
  const isM365 = copilotType === 'm365';
  const total = getCurrentUseCases().length;
  const m365Class = isM365 ? ' m365' : '';

  // Build sidebar tabs from byHabit (has all 7 habits for both editions)
  let viewAllTab = '<div class="uc-tab-all' + (filters.habit === 'all' ? ' active' + m365Class : '') + '" onclick="selectHabitTab(\'all\')"><div class="uc-tab-all-icon"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></div><span>View All</span></div>';

  let habitTabs = byHabit.map(bh => {
    const habit = getHabit(bh.id);
    const isActive = filters.habit === bh.id;
    return '<div class="uc-tab' + (isActive ? ' active' + m365Class : '') + '" onclick="selectHabitTab(\'' + bh.id + '\')">' +
      '<div class="uc-tab-id">' + bh.id + '</div>' +
      '<div class="uc-tab-info"><div class="uc-tab-name">' + habit.name + '</div>' +
      '<div class="uc-tab-action">' + habit.action + '</div></div></div>';
  }).join('');

  let sidebar = '<div class="uc-sidebar">' + viewAllTab +
    '<div class="uc-sidebar-divider"></div><div class="uc-sidebar-label">BY HABIT</div>' +
    habitTabs + '</div>';

  let detail = '<div class="uc-detail">' + renderDetailPanel() + '</div>';

  return '<div class="section-header"><div class="section-title-group"><div class="section-title">Use Case Bank</div>' +
    '<div class="section-subtitle">All ' + total + ' ' + (isM365 ? 'M365 Copilot' : 'Copilot Chat') + ' use cases with copy-ready prompts</div></div>' +
    renderCopilotToggle() + '</div><div class="uc-layout">' + sidebar + detail + '</div>';
}

function renderDetailPanel() {
  const isM365 = copilotType === 'm365';
  const isAll = filters.habit === 'all';
  let titleHtml = '';
  if (isAll) {
    titleHtml = '<div class="uc-detail-title"><div class="uc-detail-badge' + (isM365 ? ' m365' : '') + '"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:white"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></div>' +
      '<div><div class="uc-detail-name">All Use Cases</div><div class="uc-detail-desc">Browse the complete collection</div></div></div>';
  } else {
    const habit = getHabit(filters.habit);
    titleHtml = '<div class="uc-detail-title"><div class="uc-detail-badge' + (isM365 ? ' m365' : '') + '">' + filters.habit + '</div>' +
      '<div><div class="uc-detail-name">' + habit.name + '</div><div class="uc-detail-desc">' + habit.action + '</div></div></div>';
  }

  let roleOptions = Object.keys(DATA.roleNames).map(code => '<option value="' + code + '"' + (filters.role === code ? ' selected' : '') + '>' + DATA.roleNames[code] + '</option>').join('');
  let filtersHtml = '<div class="uc-detail-filters">' +
    '<select class="uc-mini-filter" onchange="setFilter(\'role\',this.value)"><option value="all">All Roles</option>' + roleOptions + '</select>' +
    '<select class="uc-mini-filter" onchange="setFilter(\'priority\',this.value)"><option value="all">All Priorities</option><option value="high"' + (filters.priority === 'high' ? ' selected' : '') + '>High</option><option value="medium"' + (filters.priority === 'medium' ? ' selected' : '') + '>Medium</option></select>' +
    '<div class="uc-mini-search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>' +
    '<input type="text" id="search-input" placeholder="Search prompts..." value="' + searchTerm + '" oninput="setSearch(this.value)"></div></div>';

  return '<div class="uc-detail-header">' + titleHtml + filtersHtml + '</div><div id="uc-results-area">' + renderUseCaseCardsContent() + '</div>';
}

function selectHabitTab(habitId) {
  const isM365 = copilotType === 'm365';
  const m365Class = isM365 ? ' m365' : '';

  if (habitId === 'all') {
    // Reset ALL filters when View All is clicked
    filters.habit = 'all';
    filters.role = 'all';
    filters.priority = 'all';
    filters.entry = 'all';
    searchTerm = '';
  } else {
    filters.habit = habitId;
    filters.entry = 'all';
    searchTerm = '';
  }

  // Update active tab styling
  document.querySelectorAll('.uc-tab, .uc-tab-all').forEach(t => t.classList.remove('active', 'm365'));
  if (habitId === 'all') {
    const allTab = document.querySelector('.uc-tab-all');
    if (allTab) { allTab.classList.add('active'); if (isM365) allTab.classList.add('m365'); }
  } else {
    const tabs = document.querySelectorAll('.uc-tab');
    const byHabit = getCurrentByHabit();
    const idx = byHabit.findIndex(h => h.id === habitId);
    if (idx >= 0 && tabs[idx]) { tabs[idx].classList.add('active'); if (isM365) tabs[idx].classList.add('m365'); }
  }

  // Refresh the detail panel
  const detail = document.querySelector('.uc-detail');
  if (detail) detail.innerHTML = renderDetailPanel();
}

function renderUseCaseResults() {
  const detail = document.querySelector('.uc-detail');
  if (detail) detail.innerHTML = renderDetailPanel();
}

function renderUseCaseCardsContent() {
  const useCases = getFilteredUseCases();
  const total = getCurrentUseCases().length;
  const isM365 = copilotType === 'm365';
  const habitLabel = filters.habit !== 'all' ? getHabit(filters.habit).name : '';

  let countText = 'Showing <strong>' + useCases.length + '</strong> of <strong>' + total + '</strong> use cases';
  if (habitLabel) countText += ' in <strong>' + habitLabel + '</strong>';
  if (searchTerm) countText += ' matching "<strong>' + searchTerm + '</strong>"';

  if (useCases.length === 0) {
    return '<div class="uc-results-bar">' + countText + '</div><div class="uc-card-list" style="display:flex;align-items:center;justify-content:center;padding:60px 20px;text-align:center"><div><svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:var(--text-muted);margin-bottom:12px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><div style="color:var(--text-muted);font-size:14px">No use cases found</div><div style="color:var(--text-muted);font-size:12px;margin-top:4px">Try adjusting your filters or search</div></div></div>';
  }

  return '<div class="uc-results-bar">' + countText + '</div><div class="uc-card-list">' + useCases.map(uc => renderUseCaseCard(uc, isM365 ? 'm365' : 'chat')).join('') + '</div>';
}

function renderUseCaseResultsContent() {
  return renderUseCaseCardsContent();
}

function renderUseCaseCard(uc, type) {
  const habit = getHabit(uc.habitId);
  const isM365 = type === 'm365';
  
  return '<div class="usecase-card" onclick="toggleUseCase(this)"><div class="usecase-header"><div class="usecase-top"><div class="usecase-habit-badge" style="background:' + habit.color + '">' + uc.habitId + '</div><div><div class="usecase-title">' + highlightText(uc.name, searchTerm) + '</div><div class="usecase-meta">' + highlightText(uc.role, searchTerm) + ' &bull; ' + habit.name + '</div></div></div><div class="usecase-tags"><span class="usecase-tag priority-' + uc.priority.toLowerCase() + '">' + uc.priority + '</span><span class="usecase-tag ' + (isM365 ? 'copilot-m365' : 'copilot-chat') + '">' + (isM365 ? 'M365 Copilot' : 'Copilot Chat') + '</span><span class="usecase-tag time-saved">' + uc.timeSaved + ' min/wk</span></div><div class="usecase-pain">' + highlightText(uc.pain, searchTerm) + '</div></div><div class="usecase-details"><div class="usecase-section"><div class="usecase-label">Starter Prompt</div><div class="prompt-box"><button class="copy-btn" onclick="copyPrompt(this,event)"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy</button><div class="prompt-text">' + uc.prompt + '</div></div></div><div class="usecase-section"><div class="usecase-label">Required Inputs</div><p style="font-size:13px;color:var(--text-secondary)">' + uc.inputs + '</p></div><div class="usecase-section"><div class="usecase-label">Success Metric</div><p style="font-size:13px;color:' + (isM365 ? 'var(--color-primary)' : 'var(--brand-primary-dark)') + ';font-weight:500">' + uc.metric + '</p></div><div class="usecase-section" style="background:rgba(245,158,11,0.1);padding:12px;border-radius:var(--radius-sm);margin-top:16px"><div class="usecase-label" style="color:var(--warning)">Guardrails</div><p style="font-size:12px;color:var(--text-secondary)">' + uc.guardrails + '</p></div></div><div class="usecase-footer"><span style="font-size:12px;color:var(--text-muted)">' + uc.id + ' &bull; ' + uc.entry + '</span><button class="expand-btn">View Details<svg viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></button></div></div>';
}

// ── Dynamic company use case loading ─────────────────────────────────────────
(function() {
  var company = null;
  try { company = JSON.parse(sessionStorage.getItem('active_company') || 'null'); } catch(e) {}

  function rebuildFromUseCases(chatUCs, m365UCs, client) {
    // Update client name/tagline from profile
    if (client) {
      if (client.name)    DATA.client.name    = client.name;
      if (client.tagline) DATA.client.tagline = client.tagline;

      // Update visible header and page title
      var companyName = client.shortName || client.name;
      if (companyName) {
        var titleEl = document.querySelector('.logo-title');
        if (titleEl) titleEl.textContent = companyName;
        document.title = companyName + ' | Copilot Value Explorer';
      }
    }

    // Helper: compute byRole, byHabit, totals, roleHabitMatrix, entryPoints from a use cases array
    var EP_DESCS = {
      'Copilot Chat (microsoft365.com)': 'Web interface at microsoft365.com',
      'M365 Copilot Chat':               'Web interface with org data access',
      'Outlook':                         'Email drafting and summarization',
      'Teams':                           'Meeting summaries and chat recap',
      'Word':                            'Document creation and editing',
      'Excel':                           'Data analysis and formulas',
      'PowerPoint':                      'Presentation creation'
    };
    function buildAggregates(ucs, habitIds, curatedMatrix) {
      var roleCodes = [], seenCodes = {};
      ucs.forEach(function(u) { if (!seenCodes[u.code]) { seenCodes[u.code] = true; roleCodes.push(u.code); } });

      // byRole
      var byRole = roleCodes.map(function(code) {
        var group = ucs.filter(function(u) { return u.code === code; });
        var ts = group.reduce(function(a, u) { return a + (u.timeSaved || 0); }, 0);
        var hp = group.filter(function(u) { return u.priority === 'High'; }).length;
        // Derive topHabits from curated matrix (rank 1,2,3 = most relevant) for consistency
        var curatedRow = (curatedMatrix || []).find(function(r) { return r.role === code; });
        var topHabits;
        if (curatedRow) {
          var sortedKeys = ['h1','h2','h3','h4','h5','h6','h7']
            .sort(function(a, b) { return curatedRow[a] - curatedRow[b]; });
          topHabits = sortedKeys.slice(0, 3).map(function(k) {
            return habitIds[parseInt(k.replace('h',''), 10) - 1];
          });
        } else {
          var ranked = group.slice().sort(function(a, b) { return (b.timeSaved||0) - (a.timeSaved||0); });
          topHabits = ranked.slice(0, 3).map(function(u) { return u.habitId; });
        }
        return {
          role: group[0].role, code: code,
          useCases: group.length, highPriority: hp, timeSaved: ts,
          topHabits: topHabits
        };
      });

      // byHabit
      var total = ucs.length;
      var byHabit = habitIds.map(function(hid) {
        var group = ucs.filter(function(u) { return u.habitId === hid; });
        var ts = group.reduce(function(a, u) { return a + (u.timeSaved||0); }, 0);
        return { id: hid, count: group.length, pct: total ? Math.round(group.length / total * 1000) / 10 : 0, timeSaved: ts };
      });

      // totals
      var totals = {
        useCases: ucs.length,
        highPriority: ucs.filter(function(u) { return u.priority === 'High'; }).length,
        timeSaved: ucs.reduce(function(a, u) { return a + (u.timeSaved||0); }, 0)
      };

      // roleHabitMatrix — use curated rankings if available, otherwise compute from timeSaved
      var roleHabitMatrix = roleCodes.map(function(code) {
        var curated = (curatedMatrix || []).find(function(r) { return r.role === code; });
        if (curated) return curated;
        var group = ucs.filter(function(u) { return u.code === code; });
        var sorted = group.slice().sort(function(a, b) { return (b.timeSaved||0) - (a.timeSaved||0); });
        var rankMap = {};
        sorted.forEach(function(u, i) { rankMap[u.habitId] = i + 1; });
        var row = { role: code };
        habitIds.forEach(function(hid, i) { row['h' + (i + 1)] = rankMap[hid] || 7; });
        return row;
      });

      // entryPoints: {name, desc, count} objects
      var epMap = {}, epOrder = [];
      ucs.forEach(function(u) { if (!epMap[u.entry]) { epMap[u.entry] = 0; epOrder.push(u.entry); } epMap[u.entry]++; });
      var entryPoints = epOrder.map(function(name) {
        return { name: name, desc: EP_DESCS[name] || name, count: epMap[name] };
      });

      return { byRole: byRole, byHabit: byHabit, totals: totals, roleHabitMatrix: roleHabitMatrix, entryPoints: entryPoints };
    }

    // Rankings based on primary task fit per role (1 = most relevant, 7 = least relevant)
    // Methodology: Dillon et al., "Early Impacts of M365 Copilot" (Microsoft Research, 2025, arxiv:2504.11443)
    // Chat: CH1=Q&A, CH2=Research, CH3=Email, CH4=Meeting, CH5=Content, CH6=DocInsights, CH7=Data
    var CURATED_CHAT_MATRIX = [
      {role:'KW',  h1:3, h2:6, h3:1, h4:4, h5:2, h6:5, h7:7},
      {role:'MGR', h1:4, h2:6, h3:2, h4:1, h5:3, h6:5, h7:7},
      {role:'FIN', h1:7, h2:3, h3:5, h4:6, h5:4, h6:2, h7:1},
      {role:'HR',  h1:4, h2:3, h3:2, h4:5, h5:1, h6:6, h7:7},
      {role:'CS',  h1:2, h2:4, h3:1, h4:5, h5:3, h6:6, h7:7},
      {role:'IT',  h1:1, h2:3, h3:7, h4:6, h5:4, h6:2, h7:5}
    ];
    // M365: MH1=Personal, MH2=Email, MH3=Meeting, MH4=Research, MH5=Content, MH6=DocInsights, MH7=Data
    var CURATED_M365_MATRIX = [
      {role:'KW',  h1:2, h2:1, h3:4, h4:6, h5:3, h6:5, h7:7},
      {role:'MGR', h1:3, h2:2, h3:1, h4:6, h5:4, h6:5, h7:7},
      {role:'FIN', h1:7, h2:5, h3:6, h4:3, h5:4, h6:2, h7:1},
      {role:'HR',  h1:5, h2:2, h3:6, h4:3, h5:1, h6:4, h7:7},
      {role:'CS',  h1:2, h2:1, h3:5, h4:4, h5:3, h6:6, h7:7},
      {role:'IT',  h1:6, h2:7, h3:5, h4:2, h5:3, h6:1, h7:4}
    ];

    var chatHabitIds = ['CH1','CH2','CH3','CH4','CH5','CH6','CH7'];
    var m365HabitIds = ['MH1','MH2','MH3','MH4','MH5','MH6','MH7'];

    var chatAgg = buildAggregates(chatUCs, chatHabitIds, CURATED_CHAT_MATRIX);
    var m365Agg = buildAggregates(m365UCs, m365HabitIds, CURATED_M365_MATRIX);

    DATA.chat.byRole          = chatAgg.byRole;
    DATA.chat.byHabit         = chatAgg.byHabit;
    DATA.chat.totals          = chatAgg.totals;
    DATA.chat.roleHabitMatrix = chatAgg.roleHabitMatrix;
    DATA.chat.entryPoints     = chatAgg.entryPoints;

    DATA.m365.byRole          = m365Agg.byRole;
    DATA.m365.byHabit         = m365Agg.byHabit;
    DATA.m365.totals          = m365Agg.totals;
    DATA.m365.roleHabitMatrix = m365Agg.roleHabitMatrix;
    DATA.m365.entryPoints     = m365Agg.entryPoints;

    DATA.useCases = { chat: chatUCs, m365: m365UCs };

    // Rebuild roleNames and roleIcons from use cases
    var allUCs = chatUCs.concat(m365UCs);
    var roleNames = {}, seenN = {};
    allUCs.forEach(function(u) { if (!seenN[u.code]) { seenN[u.code] = true; roleNames[u.code] = u.role; } });
    DATA.roleNames = roleNames;

    // Generic icons for each role position (reuse existing if code matches, else generic)
    var genericIcons = [
      '<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M20 7h-5V4c0-1.1-.9-2-2-2h-2c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4z"/></svg>'
    ];
    var roleIcons = {};
    Object.keys(roleNames).forEach(function(code, i) {
      roleIcons[code] = DATA.roleIcons[code] || genericIcons[i % genericIcons.length];
    });
    DATA.roleIcons = roleIcons;
  }

  function init() { render(); }

  if (company && company.id) {
    // Try static profile JSON first (works on Vercel), fall back to local dev server
    fetch('profile/' + company.id + '.json')
      .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(function(d) {
        if (d.useCases && d.useCases.chat && d.useCases.m365
            && d.useCases.chat.length > 0 && d.useCases.m365.length > 0) {
          rebuildFromUseCases(d.useCases.chat, d.useCases.m365, d.data && d.data.client);
          init();
        } else {
          // Static file exists but no useCases — try local server
          throw new Error('no usecases');
        }
      })
      .catch(function() {
        // Static file unavailable — fall back to local dev server
        fetch('http://localhost:3002/profile?id=' + encodeURIComponent(company.id))
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.found && d.useCases && d.useCases.chat && d.useCases.m365
                && d.useCases.chat.length > 0 && d.useCases.m365.length > 0) {
              rebuildFromUseCases(d.useCases.chat, d.useCases.m365, d.data && d.data.client);
            }
            init();
          })
          .catch(function() { init(); });
      });
  } else { init(); }
})();
</script>
